<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Der unklickbare Knopf</title>
  <link rel="stylesheet"
        href="style.css">
</head>
<body>
  <!-- Statuszeile oben -->
  <p id="statuszeile">Stufe 1 · Versuche 0 · Esc = beenden</p>

  <!-- Spielfläche: füllt das ganze Browserfenster -->
  <main id="spielflaeche">
    <button id="knopf">Klick mich</button>
    <p id="erwischt" hidden>Erwischt!</p>
  </main>

  <!-- Endmeldung: erst sichtbar, wenn Esc gedrückt wurde -->
  <div id="endmeldung" hidden>
    <p id="endtext">Spiel beendet</p>
    <button id="nochmals">Nochmals spielen</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
